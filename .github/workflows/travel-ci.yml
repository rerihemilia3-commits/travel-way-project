name: Travel Website CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  website-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check HTML document
        run: test -f travel.html

      - name: Check CSS stylesheet
        run: test -f travel-style.css

      - name: Check JavaScript file
        run: test -f travel-script.js

      - name: Validate JavaScript
        run: node --check travel-script.js

      - name: Verify travel destinations
        run: grep -q "Италия" travel-script.js

      - name: Finish CI Pipeline
        run: echo "Travel website validation completed!"
