<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAVEL WAY</title>
    <link rel="stylesheet" href="travel-style.css">
</head>
<body>

    <header>
        <div class="logo">TRAVEL WAY</div>
        <nav>
            <a href="#main">Главная</a>
            <a href="#places">Направления</a>
            <a href="#contact">Контакты</a>
        </nav>
    </header>

    <section class="welcome" id="main">
        <div class="content">
            <span>ОТКРОЙ МИР ВМЕСТЕ С НАМИ</span>
            <h1>Путешествия<br>начинаются здесь</h1>
            <p>Новые места, яркие эмоции и незабываемые впечатления.</p>
            <button onclick="showInfo()">Выбрать путешествие</button>
        </div>
    </section>

    <section class="places" id="places">
        <h2>Популярные направления</h2>

        <div class="cards">
            <article>
                <h3>Италия</h3>
                <p>История и архитектура</p>
            </article>

            <article>
                <h3>Турция</h3>
                <p>Море и отдых</p>
            </article>

            <article>
                <h3>Япония</h3>
                <p>Культура и технологии</p>
            </article>
        </div>
    </section>

    <footer id="contact">
        <p>TRAVEL WAY © 2026</p>
    </footer>

    <script src="travel-script.js"></script>

</html>
